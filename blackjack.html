<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <title>国士無荘 - ブラックジャック</title>
    <link rel="stylesheet" href="css/style.css">
</head>

<body>

<div class="container">

    <h1>国士無荘</h1>
    <p class="subtitle">ブラックジャック - BLACKJACK</p>

    <div class="score-board">
        <p>現在の点数</p>
        <div id="score">100,000</div>
        <span>点</span>
    </div>

    <h2 class="section-title">加点</h2>

    <div class="score-buttons">
        <button onclick="changeScore(1000)">+1000</button>
    </div>

    <h2 class="section-title minus-title">減点</h2>

    <div class="score-buttons minus">
        <button onclick="changeScore(-1000)">-1000</button>
    </div>

    <button class="back-button" onclick="location.href='games.html'">
        ゲーム選択へ戻る
    </button>

	<button class="logout-button" onclick="location.href='logout.html'">
	    ログアウト
	</button>

</div>

<script src="js/game.js"></script>

</body>
</html>

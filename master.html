<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>
        国士無荘 - マスターランキング
    </title>


    <link
        rel="stylesheet"
        href="css/master.css"
    >


    <!-- Supabase -->

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2">
    </script>

    <script src="js/supabase.js">
    </script>

</head>


<body>


<div class="master-container">


    <header class="master-header">

        <p class="master-subtitle">
            KOKUSHI MUSO
        </p>

        <h1>
            MASTER RANKING
        </h1>

        <p class="master-description">
            TOP 10 PLAYER RANKING
        </p>

    </header>


    <main>

        <div
            id="rankingList"
            class="ranking-list"
        ></div>

    </main>


    <div class="master-buttons">


        <button
            onclick="displayRanking()"
            class="refresh-button"
        >
            ランキング更新
        </button>


        <button
            onclick="location.href='index.html'"
            class="back-button"
        >
            戻る
        </button>


    </div>


</div>


<script>


async function displayRanking() {


    const rankingList =
        document.getElementById(
            "rankingList"
        );


    // いったん消去

    rankingList.innerHTML = "";


    // Supabaseから取得

    const { data, error } =
        await supabaseClient
            .from("scores")
            .select("*")
            .order("score", {
                ascending: false
            })
            .limit(10);


    // エラー

    if (error) {

        console.error(error);

        rankingList.innerHTML = `
            <div class="no-data">
                ランキングの取得に失敗しました。
            </div>
        `;

        return;
    }


    // データなし

    if (!data || data.length === 0) {

        rankingList.innerHTML = `
            <div class="no-data">
                まだランキングデータがありません。
            </div>
        `;

        return;
    }


    // TOP10表示

    data.forEach(
        function(player, index) {


            const rank =
                index + 1;


            const item =
                document.createElement(
                    "div"
                );


            item.classList.add(
                "ranking-item"
            );


            // 1～3位

            if (rank === 1) {

                item.classList.add(
                    "rank-1"
                );

            }
            else if (rank === 2) {

                item.classList.add(
                    "rank-2"
                );

            }
            else if (rank === 3) {

                item.classList.add(
                    "rank-3"
                );

            }
            else {

                item.classList.add(
                    "rank-normal"
                );

            }


            // メダル

            let medal;


            if (rank === 1) {

                medal = "👑";

            }
            else if (rank === 2) {

                medal = "🥈";

            }
            else if (rank === 3) {

                medal = "🥉";

            }
            else {

                medal = rank;

            }


            // HTML

            item.innerHTML = `

                <div class="rank-number">
                    ${medal}
                </div>


                <div class="player-name">
                    ${escapeHTML(player.name)}
                </div>


                <div class="player-score">
                    ${Number(player.score)
                        .toLocaleString()} 点
                </div>


                <div class="player-date">
                    ${new Date(
                        player.created_at
                    ).toLocaleString("ja-JP")}
                </div>


                <button
                    class="delete-button"
                    onclick="deleteRecord(${player.id})"
                >
                    削除
                </button>

            `;


            rankingList.appendChild(
                item
            );

        }
    );

}



// 削除

async function deleteRecord(id) {


    const answer =
        confirm(
            "この記録を削除しますか？"
        );


    if (!answer) {

        return;
    }


    const { error } =
        await supabaseClient
            .from("scores")
            .delete()
            .eq("id", id);


    if (error) {

        console.error(error);

        alert(
            "削除に失敗しました。"
        );

        return;
    }


    // 再表示

    displayRanking();

}



// HTMLエスケープ

function escapeHTML(text) {

    const div =
        document.createElement(
            "div"
        );

    div.textContent = text;

    return div.innerHTML;

}



// 初回表示

displayRanking();

</script>


</body>
</html>

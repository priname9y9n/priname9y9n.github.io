<!DOCTYPE html>
<html lang="ja">

<head>

    <meta charset="UTF-8">

    <title>国士無荘 - マスターランキング</title>

    <link rel="stylesheet" href="css/master.css">

</head>

<body>

<div class="master-container">

    <header class="master-header">

        <p class="master-subtitle">
            KOKUSHI MUSO
        </p>

        <h1>
            MASTER RANKING
        </h1>

        <p class="master-description">
            TOP 9 PLAYER RANKING
        </p>

    </header>


    <main>

        <div id="rankingList" class="ranking-list"></div>

    </main>


    <div class="master-buttons">

        <button
            onclick="displayRanking()"
            class="refresh-button">
            ランキング更新
        </button>

        <button
            onclick="location.href='index.html'"
            class="back-button">
            戻る
        </button>

    </div>

</div>


<script>

function displayRanking() {

    const rankingList =
        document.getElementById("rankingList");

    // 一度表示を空にする
    rankingList.innerHTML = "";


    // logout.htmlで保存された記録を取得
    const records =
        JSON.parse(localStorage.getItem("masterRecords")) || [];


    // 元の配列番号を保持して点数順に並べ替える
    const sortedRecords = records
        .map(function(record, index) {

            return {
                record: record,
                originalIndex: index
            };

        })
        .sort(function(a, b) {

            return Number(b.record.score) -
                   Number(a.record.score);

        })
        // 上位10件だけ表示
        .slice(0, 10);


    // データがない場合
    if (sortedRecords.length === 0) {

        rankingList.innerHTML = `
            <div class="no-data">
                まだランキングデータがありません。
            </div>
        `;

        return;
    }


    // ランキングを表示
    sortedRecords.forEach(function(item, index) {

        const player = item.record;
        const rank = index + 1;

        const rankingItem =
            document.createElement("div");

        rankingItem.classList.add("ranking-item");


        // 1～3位専用クラス
        if (rank === 1) {

            rankingItem.classList.add("rank-1");

        } else if (rank === 2) {

            rankingItem.classList.add("rank-2");

        } else if (rank === 3) {

            rankingItem.classList.add("rank-3");

        } else {

            rankingItem.classList.add("rank-normal");

        }


        // メダル
        let medal;

        if (rank === 1) {

            medal = "👑";

        } else if (rank === 2) {

            medal = "🥈";

        } else if (rank === 3) {

            medal = "🥉";

        } else {

            medal = rank;

        }


        rankingItem.innerHTML = `

            <div class="rank-number">
                ${medal}
            </div>

            <div class="player-name">
                ${escapeHTML(player.name)}
            </div>

            <div class="player-score">
                ${Number(player.score).toLocaleString()} 点
            </div>

            <div class="player-date">
                ${escapeHTML(player.date || "")}
            </div>

            <button
                class="delete-button"
                onclick="deleteRecord(${item.originalIndex})">
                削除
            </button>

        `;


        rankingList.appendChild(rankingItem);

    });

}


// 記録を削除
function deleteRecord(index) {

    const records =
        JSON.parse(localStorage.getItem("masterRecords")) || [];


    const target = records[index];


    if (!target) {

        alert("削除するデータが見つかりません。");

        return;
    }


    // 削除確認
    const result = confirm(
        "このプレイヤーの記録を削除しますか？\n\n" +
        "名前：" + target.name + "\n" +
        "点数：" + Number(target.score).toLocaleString() + " 点"
    );


    if (!result) {

        return;

    }


    // 指定した記録だけ削除
    records.splice(index, 1);


    // 保存
    localStorage.setItem(
        "masterRecords",
        JSON.stringify(records)
    );


    // ランキング更新
    displayRanking();

}


// HTMLとして解釈されないようにする
function escapeHTML(text) {

    const div = document.createElement("div");

    div.textContent = text;

    return div.innerHTML;

}


// ページ読み込み時にランキング表示
displayRanking();

</script>

</body>

</html>
